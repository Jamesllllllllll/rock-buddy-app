name: Public desktop staging compatibility
on:
  push:
    branches: [test/public-1.11.0-staging]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'Jamesllllllllll/rock-buddy-app' && github.ref == 'refs/heads/test/public-1.11.0-staging'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download and verify the original public release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Invoke-WebRequest 'https://github.com/tnt-coders/rock-buddy-app/releases/download/v1.11.0/rock-buddy-Setup-1.11.0.exe' -OutFile release/original-setup.exe
          if ((Get-FileHash release/original-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd4d44c84b086627e07920648800d553d168d9176bc0400740158b5d932149263') { throw 'Public installer checksum mismatch' }
          7z e release/original-setup.exe '$PLUGINSDIR/app-64.7z' -orelease/installer -y
          if ($LASTEXITCODE -ne 0) { throw 'Installer extraction failed' }
          7z x release/installer/app-64.7z -orelease/public-staging -y
          if ($LASTEXITCODE -ne 0) { throw 'Application extraction failed' }
      - name: Add staging CSP origin and verify archive parity
        run: node tooling/package-public-staging.cjs
      - name: Test the public Windows executable against staging
        run: node tooling/smoke-public-staging.cjs
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          # Startup writes logs beside the executable; exclude CI-generated logs.
          Get-ChildItem release/public-staging -Filter 'rock_buddy_log*.txt' | Remove-Item
          7z a -tzip release/Rock-Buddy-1.11.0-Staging-Compatibility.zip ./release/public-staging/*
          if ($LASTEXITCODE -ne 0) { throw 'ZIP creation failed' }
          $hash = (Get-FileHash release/Rock-Buddy-1.11.0-Staging-Compatibility.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Rock-Buddy-1.11.0-Staging-Compatibility.zip" | Set-Content release/SHA256SUMS.txt
      - name: Publish test download on the fork
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "public-staging-${{ github.run_id }}-${{ github.run_attempt }}" release/Rock-Buddy-1.11.0-Staging-Compatibility.zip release/SHA256SUMS.txt --target '${{ github.sha }}' --title 'Public 1.11.0 — staging compatibility' --notes-file PUBLIC-STAGING.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Test release publication failed' }
