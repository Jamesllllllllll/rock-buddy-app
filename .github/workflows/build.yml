name: Build
on:
  workflow_dispatch:
permissions:
  contents: read

# Historical branches retain explicit checks, not automatic installers or releases.
concurrency:
  group: historical-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_on_win:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Test RockSniffer profile observer
        run: dotnet test RockSniffer/RockSnifferLib/RockSnifferLib.Tests/RockSnifferLib.Tests.csproj --configuration Release
      - run: npm run build
